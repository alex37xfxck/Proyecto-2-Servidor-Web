<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conectando con Spotify...</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================================
         MENSAJE DE CONEXIÓN
         ===================================================== -->
    <main class="container">

        <section class="hero">

            <span class="eyebrow">
                SPOTIFY
            </span>

            <h1>
                Conectando con Spotify...
            </h1>

            <p id="message">
                Estamos preparando tu experiencia musical.
            </p>

        </section>

    </main>


    <script>

        /* =====================================================
           CONFIGURACIÓN
           ===================================================== */

        const CLIENT_ID =
            "a2c7f03b916b4d808baddd013980dcbf";

        function normalizeSpotifyHost() {

            if (window.location.hostname === "localhost") {

                const port =
                    window.location.port
                        ? ":" + window.location.port
                        : "";

                const normalizedUrl =
                    "http://127.0.0.1" +
                    port +
                    window.location.pathname +
                    window.location.search +
                    window.location.hash;

                window.location.replace(normalizedUrl);

                return false;
            }

            return true;
        }


        const SPOTIFY_HOST_OK =
            normalizeSpotifyHost();


        function getSpotifyRedirectUri() {

            if (
                window.location.protocol !== "http:" ||
                window.location.hostname !== "127.0.0.1"
            ) {
                throw new Error(
                    "Spotify debe ejecutarse desde el navegador de la VM usando 127.0.0.1."
                );
            }


            const port =
                window.location.port
                    ? ":" + window.location.port
                    : "";


            return (
                "http://127.0.0.1" +
                port +
                "/callback.html"
            );
        }


        const REDIRECT_URI =
            getSpotifyRedirectUri();


        /* =====================================================
           INTERCAMBIO DEL CÓDIGO POR TOKENS
           ===================================================== */

        async function getAccessToken(code) {

            const verifier =
                sessionStorage.getItem(
                    "spotify_code_verifier"
                );


            if (!verifier) {

                throw new Error(
                    "No encontramos el código de verificación."
                );
            }


            const response =
                await fetch(
                    "https://accounts.spotify.com/api/token",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({

                                client_id:
                                    CLIENT_ID,

                                grant_type:
                                    "authorization_code",

                                code:
                                    code,

                                redirect_uri:
                                    REDIRECT_URI,

                                code_verifier:
                                    verifier

                            })
                    }
                );


            let data = null;

            try {

                data =
                    await response.json();

            } catch (error) {

                data = null;
            }


            if (!response.ok) {

                throw new Error(
                    data?.error_description ||
                    "Spotify rechazó la solicitud de acceso."
                );
            }


            if (!data?.access_token) {

                throw new Error(
                    "Spotify no devolvió un token de acceso."
                );
            }


            return data;
        }


        /* =====================================================
           IDENTIFICAR AL INTEGRANTE
           ===================================================== */

        function getUserFromReturnPath(returnPath) {

            const match =
                returnPath.match(
                    /\/(Alex|Adzuria|Efra|Erik)\/gustos\.html$/
                );

            return match ? match[1] : null;
        }


        /* =====================================================
           PROCESO PRINCIPAL
           ===================================================== */

        async function connectSpotify() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const code =
                params.get("code");

            const error =
                params.get("error");


            /* -------------------------------------------------
               Spotify devolvió un error
               ------------------------------------------------- */

            if (error) {

                const description =
                    params.get("error_description");


                throw new Error(
                    description ||
                    "No autorizaste el acceso a Spotify."
                );
            }


            /* -------------------------------------------------
               Validar código
               ------------------------------------------------- */

            if (!code) {

                throw new Error(
                    "No recibimos el código de Spotify."
                );
            }


            /* -------------------------------------------------
               Recuperar la página de origen
               ------------------------------------------------- */

            const returnPath =
                sessionStorage.getItem(
                    "spotify_return_path"
                );


            if (!returnPath) {

                throw new Error(
                    "No encontramos la sesión de origen. " +
                    "Regresa a la página de gustos y pulsa " +
                    "«Conectar con Spotify» nuevamente."
                );
            }


            /* -------------------------------------------------
               Validar que la ruta pertenezca al proyecto
               ------------------------------------------------- */

            const user =
                getUserFromReturnPath(
                    returnPath
                );


            if (!user) {

                throw new Error(
                    "La página de destino no es válida."
                );
            }


            /* -------------------------------------------------
               Validación opcional de STATE

               spotify.js todavía puede funcionar sin state.
               Cuando lo añadamos, esta comprobación lo validará
               automáticamente sin cambiar el resto del flujo.
               ------------------------------------------------- */

            const returnedState =
                params.get("state");

            const savedState =
                sessionStorage.getItem(
                    "spotify_state"
                );


            if (
                !returnedState ||
                !savedState ||
                returnedState !== savedState
            ) {

                throw new Error(
                    "La validación de seguridad de Spotify falló. " +
                    "Inicia el proceso nuevamente desde la página de gustos."
                );
            }


            /* -------------------------------------------------
               Obtener tokens
               ------------------------------------------------- */

            const tokenData =
                await getAccessToken(
                    code
                );


            /* -------------------------------------------------
               Crear claves individuales
               ------------------------------------------------- */

            const accessTokenKey =
                "spotify_access_token_" +
                user;

            const refreshTokenKey =
                "spotify_refresh_token_" +
                user;


            /* -------------------------------------------------
               Guardar access token
               ------------------------------------------------- */

            sessionStorage.setItem(
                accessTokenKey,
                tokenData.access_token
            );


            /* -------------------------------------------------
               Guardar refresh token
               ------------------------------------------------- */

            if (tokenData.refresh_token) {

                sessionStorage.setItem(
                    refreshTokenKey,
                    tokenData.refresh_token
                );
            }


            /* -------------------------------------------------
               Limpiar datos temporales
               ------------------------------------------------- */

            sessionStorage.removeItem(
                "spotify_code_verifier"
            );

            sessionStorage.removeItem(
                "spotify_return_path"
            );

            sessionStorage.removeItem(
                "spotify_state"
            );


            /* -------------------------------------------------
               Mensaje visual
               ------------------------------------------------- */

            const message =
                document.getElementById(
                    "message"
                );


            if (message) {

                message.textContent =
                    "¡Spotify conectado! Preparando tu perfil...";
            }


            /* -------------------------------------------------
               Regresar a la página correspondiente

               replace evita dejar callback.html en el historial.
               ------------------------------------------------- */

            setTimeout(() => {

                window.location.replace(
                    returnPath
                );

            }, 700);
        }


        /* =====================================================
           EJECUTAR
           ===================================================== */

        connectSpotify().catch(error => {

            console.error(
                "Error conectando con Spotify:",
                error
            );


            const message =
                document.getElementById(
                    "message"
                );


            if (message) {

                message.textContent =
                    error.message ||
                    "Ocurrió un error al conectar con Spotify.";
            }

        });

    </script>

</body>

</html>
